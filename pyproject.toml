# pyproject.toml
[project]
name = "healtharchive"
version = "0.0.1"
description = "Backend services and archiving pipeline for HealthArchive.ca"
authors = [
  { name = "Jeremy Dawson" }
]
requires-python = ">=3.11"
dependencies = [
  # Core runtime deps
  "SQLAlchemy>=2.0",
  "alembic>=1.18.4",
  "warcio>=1.8.1",
  "beautifulsoup4>=4.12",
  "fastapi>=0.135.3",
  "starlette>=1.3.1",  # CVE-2026-54282/CVE-2026-54283 fixes
  "uvicorn[standard]>=0.30",
  "httpx>=0.28.1",
  "idna>=3.15",  # CVE-2026-45409 fix
  "slowapi>=0.1.9",
]

[project.scripts]
archive-tool = "archive_tool.main:main"
healtharchive = "ha_backend.cli:main"

[project.optional-dependencies]
dev = [
  "ruff==0.15.11",
  "mypy",
  "types-PyYAML",
  "pytest",
  "pytest-cov",
  "bandit",
  "pip-audit",
  "pre-commit",
  "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 fix via audit tooling
  "requests>=2.33.0",  # CVE-2026-25645 fix
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material[imaging]",
  "pymdown-extensions>=10.21.3",  # CVE-2026-46338 fix
  "mkdocs-minify-plugin",
  "mkdocs-monorepo-plugin",
  "mkdocs-swagger-ui-tag",
  "cairosvg",
  "pillow",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]  # Module level import not at top of file (allow docstrings after __future__)

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
# All 18 findings are false positives for this codebase:
# B101: assert for type narrowing (diffing.py BeautifulSoup Tag check)
# B103: 0o666 on job lock files — intentional for multi-process access
# B108: /tmp job lock dir — configurable via HEALTHARCHIVE_JOB_LOCK_DIR env var
# B112: try/except/continue in infra_errors.py — resilience pattern
# B404,B603,B607: subprocess with hardcoded systemctl/findmnt commands in CLI/worker
skips = ["B101", "B103", "B108", "B112", "B404", "B603", "B607"]

[tool.coverage.paths]
source = ["src/"]
