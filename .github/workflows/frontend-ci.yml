name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch: {}

concurrency:
  group: healtharchive-frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-sync:
    name: Frontend CI / contract-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API contract is current
        run: make contract-check

  lint-and-test:
    name: Frontend CI / lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
      NEXT_PUBLIC_SHOW_API_HEALTH_BANNER: "false"
      NEXT_PUBLIC_LOG_API_HEALTH_FAILURE: "false"
      NEXT_PUBLIC_SHOW_API_BASE_HINT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Check
        run: make frontend-ci

      - name: Lighthouse performance budgets
        run: make frontend-lighthouse

      - name: Upload Lighthouse reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-lighthouse-reports
          path: frontend/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 3

  docker-build-smoke:
    name: Frontend CI / docker-build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - contract-sync
      - lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build production image
        run: docker build -t healtharchive-frontend:ci frontend

      - name: Smoke-test public URL references in isolated image
        shell: bash
        env:
          SMOKE_CONTAINER: healtharchive-frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cleanup() {
            docker stop --time 2 "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
            docker rm --force "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --pull=never --detach \
            --name "$SMOKE_CONTAINER" \
            --network none \
            --read-only \
            --user 1001:1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,uid=1001,gid=1001,mode=1777 \
            --tmpfs /app/.next/cache:rw,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=0755 \
            --env NEXT_PUBLIC_API_BASE_URL=http://localhost:8001 \
            --env NEXT_PUBLIC_REPLAY_BASE_URL=https://replay-sentinel.invalid \
            healtharchive-frontend:ci

          docker exec --interactive --user 1001:1001 "$SMOKE_CONTAINER" \
            node --input-type=module - \
            < frontend/scripts/docker-public-config-smoke.mjs

  # TEMPORARY: one isolated browser comparison for PR #159; remove after observation.
  # This is non-blocking and independent of the ordinary frontend CI jobs above.
  lighthouse-browser-comparison:
    name: Frontend CI / temporary Lighthouse browser comparison
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 159 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/production-public-build-config-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout comparison helper revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout fixed reviewed app source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 6d6ae6c99f606884aecf3fa698a799f1ee0a354f
          path: app-under-test
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.19.0"

      - name: Install fixed app dependencies and build once
        working-directory: app-under-test/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
          NEXT_PUBLIC_REPLAY_BASE_URL: https://replay-sentinel.invalid
          NEXT_PUBLIC_SHOW_API_HEALTH_BANNER: "false"
          NEXT_PUBLIC_LOG_API_HEALTH_FAILURE: "false"
          NEXT_PUBLIC_SHOW_API_BASE_HINT: "false"
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Run non-blocking matched-browser comparison
        env:
          COMPARISON_HELPER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ./frontend/scripts/lighthouse-browser-comparison.sh "$GITHUB_WORKSPACE/app-under-test"
