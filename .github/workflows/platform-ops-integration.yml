name: Platform Ops Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: healtharchive-platform-ops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHECKOUT_ID: healtharchive/healtharchive
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check --upgrade pip PyYAML

      - name: Validate public example contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          contract_base = "platform-ops-contract"
          path = Path(f"{contract_base}.example.yaml")
          manifest = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert manifest["version"] == 1
          assert manifest["repo_root"] == "healtharchive/healtharchive"
          assert isinstance(manifest["services"], list) and manifest["services"]
          for service in manifest["services"]:
              assert service.get("service_id")
              assert isinstance(service.get("boundary_entrypoints"), list)
          PY

      - name: Clone platform-ops
        if: ${{ hashFiles(format('{0}.yaml', 'platform-ops-contract')) != '' }}
        env:
          PLATFORM_OPS_READONLY_TOKEN: ${{ secrets.PLATFORM_OPS_READONLY_TOKEN }}
        run: |
          set -euo pipefail
          clone_url="https://github.com/jerdaw/platform-ops.git"
          if [ -n "${PLATFORM_OPS_READONLY_TOKEN}" ]; then
            auth_header="$(printf 'x-access-token:%s' "${PLATFORM_OPS_READONLY_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              clone --depth 1 --branch main "${clone_url}" "${RUNNER_TEMP}/platform-ops"
          else
            git clone --depth 1 --branch main "${clone_url}" "${RUNNER_TEMP}/platform-ops"
          fi

      - name: Assemble temp repos root
        if: ${{ hashFiles(format('{0}.yaml', 'platform-ops-contract')) != '' }}
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/repos-root/${CHECKOUT_ID}"
          mkdir -p "${target}"
          cp -a "${GITHUB_WORKSPACE}/." "${target}/"

      - name: Run shared doc-boundary check
        if: ${{ hashFiles(format('{0}.yaml', 'platform-ops-contract')) != '' }}
        run: |
          python3 "${RUNNER_TEMP}/platform-ops/scripts/checks/check-shared-doc-boundary.py" \
            --repos-root "${RUNNER_TEMP}/repos-root" \
            --checkout "${CHECKOUT_ID}"

      - name: Run runtime-contract sync check
        if: ${{ hashFiles(format('{0}.yaml', 'platform-ops-contract')) != '' }}
        run: |
          python3 "${RUNNER_TEMP}/platform-ops/scripts/checks/check-runtime-contract-sync.py" \
            --repos-root "${RUNNER_TEMP}/repos-root" \
            --checkout "${CHECKOUT_ID}" \
            --require-manifests
